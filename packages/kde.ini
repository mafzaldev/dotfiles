# KDE Plasma settings, applied with kwriteconfig. Section = [file:group(:subgroup)].
# Mirrors the GNOME setup: dark theme, Bibata cursor, Inter/JetBrains Mono fonts, screen never auto-locks or blanks.

[kdeglobals:General]
ColorScheme=BreezeDark
font=Inter Variable,11,-1,5,50,0,0,0,0,0
menuFont=Inter Variable,11,-1,5,50,0,0,0,0,0
toolBarFont=Inter Variable,10,-1,5,50,0,0,0,0,0
smallestReadableFont=Inter Variable,9,-1,5,50,0,0,0,0,0
fixed=JetBrains Mono,11,-1,5,50,0,0,0,0,0

[kdeglobals:WM]
activeFont=Inter Variable,11,-1,5,50,0,0,0,0,0

[kcminputrc:Mouse]
cursorTheme=Bibata-Modern-Classic
cursorSize=20

[kscreenlockerrc:Daemon]
Autolock=false

[powerdevilrc:AC:Display]
DimDisplayWhenIdle=false
TurnOffDisplayWhenIdle=false

[powerdevilrc:Battery:Display]
DimDisplayWhenIdle=false
TurnOffDisplayWhenIdle=false
