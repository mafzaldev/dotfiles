[a11y]
always-show-universal-access-status=false

[a11y/applications]
screen-reader-enabled=false

[a11y/magnifier]
cross-hairs-length=58

[app-folders]
folder-children=['Utilities', 'YaST', 'Pardus']

[app-folders/folders/Pardus]
categories=['X-Pardus-Apps']
name='X-Pardus-Apps.directory'
translate=true

[app-folders/folders/Utilities]
apps=['gnome-abrt.desktop', 'gnome-system-log.desktop', 'nm-connection-editor.desktop', 'org.gnome.baobab.desktop', 'org.gnome.Connections.desktop', 'org.gnome.DejaDup.desktop', 'org.gnome.Dictionary.desktop', 'org.gnome.DiskUtility.desktop', 'org.gnome.Evince.desktop', 'org.gnome.FileRoller.desktop', 'org.gnome.fonts.desktop', 'org.gnome.Loupe.desktop', 'org.gnome.seahorse.Application.desktop', 'org.gnome.tweaks.desktop', 'org.gnome.Usage.desktop', 'vinagre.desktop']
categories=['X-GNOME-Utilities']
name='X-GNOME-Utilities.directory'
translate=true

[app-folders/folders/YaST]
categories=['X-SuSE-YaST']
name='suse-yast.directory'
translate=true

[background]
color-shading-type='solid'
picture-options='zoom'
picture-uri='file:///usr/share/backgrounds/moskalenko-v-Low_poly_Raccoon_Light.webp'
picture-uri-dark='file:///usr/share/backgrounds/moskalenko-v-Low_poly_Raccoon_Very_Dark.webp'
primary-color='#000000000000'
secondary-color='#000000000000'

[break-reminders/eyesight]
play-sound=true

[break-reminders/movement]
duration-seconds=uint32 300
interval-seconds=uint32 1800
play-sound=true

[input-sources]
sources=[('xkb', 'us')]
xkb-options=@as []

[interface]
accent-color='blue'
color-scheme='prefer-dark'
cursor-size=20
cursor-theme='Bibata-Modern-Classic'
document-font-name='Inter Variable 11'
font-name='Inter Variable 11'
gtk-enable-primary-paste=true
gtk-theme='Yaru-blue-dark'
icon-theme='Yaru-blue-dark'
monospace-font-name='JetBrains Mono 11'
show-battery-percentage=true
toolkit-accessibility=false

[notifications]
application-children=['firefox-firefox', 'slack-slack', 'code', 'apport-gtk', 'gnome-power-panel', 'google-chrome', 'org-gnome-terminal', 'org-gnome-nautilus', 'org-gnome-eog', 'org-gnome-characters', 'vlc', 'org-gnome-diskutility', 'snapd-desktop-integration-snapd-desktop-integration', 'slack', 'pgadmin4', 'location-trash-', 'mongodb-compass', 'org-gnome-texteditor', 'org-gnome-settings', 'freedownloadmanager', 'redisinsight', 'org-gnome-evince', 'com-microsoft-vscode', 'com-mitchellh-ghostty', 'spotify', 'org-gnome-baobab', 'update-manager']

[notifications/application/apport-gtk]
application-id='apport-gtk.desktop'

[notifications/application/code]
application-id='code.desktop'

[notifications/application/com-microsoft-vscode]
application-id='com.microsoft.VSCode.desktop'

[notifications/application/com-mitchellh-ghostty]
application-id='com.mitchellh.ghostty.desktop'

[notifications/application/firefox-firefox]
application-id='firefox_firefox.desktop'

[notifications/application/freedownloadmanager]
application-id='freedownloadmanager.desktop'

[notifications/application/gnome-power-panel]
application-id='gnome-power-panel.desktop'

[notifications/application/google-chrome]
application-id='google-chrome.desktop'

[notifications/application/location-trash-]
application-id='location:trash:///.desktop'

[notifications/application/mongodb-compass]
application-id='mongodb-compass.desktop'

[notifications/application/org-gnome-baobab]
application-id='org.gnome.baobab.desktop'

[notifications/application/org-gnome-characters]
application-id='org.gnome.Characters.desktop'

[notifications/application/org-gnome-diskutility]
application-id='org.gnome.DiskUtility.desktop'

[notifications/application/org-gnome-eog]
application-id='org.gnome.eog.desktop'

[notifications/application/org-gnome-evince]
application-id='org.gnome.Evince.desktop'

[notifications/application/org-gnome-nautilus]
application-id='org.gnome.Nautilus.desktop'

[notifications/application/org-gnome-settings]
application-id='org.gnome.Settings.desktop'

[notifications/application/org-gnome-terminal]
application-id='org.gnome.Terminal.desktop'

[notifications/application/org-gnome-texteditor]
application-id='org.gnome.TextEditor.desktop'

[notifications/application/pgadmin4]
application-id='pgadmin4.desktop'

[notifications/application/redisinsight]
application-id='redisinsight.desktop'

[notifications/application/slack-slack]
application-id='slack_slack.desktop'

[notifications/application/slack]
application-id='slack.desktop'

[notifications/application/snapd-desktop-integration-snapd-desktop-integration]
application-id='snapd-desktop-integration_snapd-desktop-integration.desktop'

[notifications/application/spotify]
application-id='spotify.desktop'

[notifications/application/update-manager]
application-id='update-manager.desktop'

[notifications/application/vlc]
application-id='vlc.desktop'

[peripherals/mouse]
speed=0.37358490566037728

[peripherals/touchpad]
click-method='fingers'
edge-scrolling-enabled=false
natural-scroll=true
two-finger-scrolling-enabled=true

[privacy]
report-technical-problems=false

[screen-time-limits]
daily-limit-seconds=uint32 28800

[screensaver]
color-shading-type='solid'
picture-options='zoom'
picture-uri='file:///usr/share/backgrounds/moskalenko-v-Low_poly_Raccoon_Light.webp'
primary-color='#000000000000'
secondary-color='#000000000000'

[search-providers]
sort-order=['org.gnome.Settings.desktop', 'org.gnome.Contacts.desktop', 'org.gnome.Nautilus.desktop']

[session]
idle-delay=uint32 0

[wm/keybindings]
maximize=@as []
unmaximize=@as []
